services:
  - type: web
    name: fb-video-downloader-api
    runtime: python
    plan: free
    rootDir: video-downloader-backend
    buildCommand: apt-get update && apt-get install -y ffmpeg && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: API_KEY
        sync: false
