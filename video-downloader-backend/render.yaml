services:
  - type: web
    name: fb-video-downloader-api
    runtime: docker
    plan: free
    rootDir: video-downloader-backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: API_KEY
        sync: false
      - key: VIDEO_JOB_TTL_SECONDS
        value: "3600"
      - key: VIDEO_JOB_MAX_BYTES
        value: "524288000"
